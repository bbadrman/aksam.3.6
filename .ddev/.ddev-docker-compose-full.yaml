name: ddev-aksamcrm
services:
  db:
    build:
      context: /home/hp/Server/Aksam/AksamCrm/.ddev/.dbimageBuild
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ddev/ddev-dbserver-mariadb-11.8:v1.25.4
        gid: "1000"
        uid: "1000"
        username: hp
      labels:
        com.ddev.app-type: symfony
        com.ddev.approot: /home/hp/Server/Aksam/AksamCrm
        com.ddev.platform: ddev
        com.ddev.site-name: AksamCrm
        com.ddev.webtag: edbebeadc5
    cap_add:
      - SYS_NICE
    command: []
    container_name: ddev-AksamCrm-db
    environment:
      COLUMNS: "185"
      DDEV_DATABASE: mariadb:11.8
      DDEV_DATABASE_FAMILY: mysql
      DDEV_GID: "1000"
      DDEV_GOARCH: amd64
      DDEV_GOOS: linux
      DDEV_HOSTNAME: aksamcrm.ddev.site
      DDEV_PHP_VERSION: "8.3"
      DDEV_PRIMARY_URL: https://aksamcrm.ddev.site
      DDEV_PRIMARY_URL_PORT: "443"
      DDEV_PRIMARY_URL_WITHOUT_PORT: https://aksamcrm.ddev.site
      DDEV_PROJECT: AksamCrm
      DDEV_PROJECT_TYPE: symfony
      DDEV_ROUTER_HTTP_PORT: "80"
      DDEV_ROUTER_HTTPS_PORT: "443"
      DDEV_SCHEME: https
      DDEV_SITENAME: AksamCrm
      DDEV_TLD: ddev.site
      DDEV_UID: "1000"
      DDEV_USER: hp
      DDEV_VERSION: v1.25.4
      DOCKER_IP: 127.0.0.1
      HOST_DOCKER_INTERNAL_IP: 172.17.0.1
      IS_DDEV_PROJECT: "true"
      LINES: "15"
      MYSQL_HISTFILE: /mnt/ddev-global-cache/mysqlhistory/AksamCrm-db/mysql_history
      PGDATABASE: db
      PGHOST: 127.0.0.1
      PGPASSWORD: db
      PGUSER: db
      POSTGRES_DB: db
      POSTGRES_PASSWORD: db
      POSTGRES_USER: db
      TZ: Africa/Casablanca
      USER: hp
    extra_hosts:
      - host.docker.internal=host-gateway
    hostname: AksamCrm-db
    healthcheck:
      test:
        - CMD-SHELL
        - /healthcheck.sh
      timeout: 1m10s
      interval: 1s
      retries: 70
      start_period: 2m0s
      start_interval: 1s
    image: ddev/ddev-dbserver-mariadb-11.8:v1.25.4-AksamCrm-built
    labels:
      com.ddev.app-type: symfony
      com.ddev.approot: /home/hp/Server/Aksam/AksamCrm
      com.ddev.platform: ddev
      com.ddev.site-name: AksamCrm
      com.ddev.webtag: edbebeadc5
    networks:
      ddev_default: null
      default: null
    ports:
      - mode: ingress
        host_ip: 127.0.0.1
        target: 3306
        published: "0"
        protocol: tcp
    restart: 'no'
    stop_grace_period: 1m0s
    user: 1000:1000
    volumes:
      - type: volume
        source: database
        target: /var/lib/mysql
        volume:
          nocopy: true
      - type: bind
        source: /home/hp/Server/Aksam/AksamCrm/.ddev
        target: /mnt/ddev_config
        bind: {}
      - type: bind
        source: /home/hp/Server/Aksam/AksamCrm/.ddev/db_snapshots
        target: /mnt/snapshots
        bind: {}
      - type: volume
        source: ddev-global-cache
        target: /mnt/ddev-global-cache
        volume: {}
    working_dir: /home/hp
  phpmyadmin:
    container_name: ddev-AksamCrm-phpmyadmin
    depends_on:
      db:
        condition: service_healthy
        required: true
    environment:
      HOST_DOCKER_INTERNAL_IP: 172.17.0.1
      HTTP_EXPOSE: 8036:80
      HTTPS_EXPOSE: 8037:80
      PMA_HOST: db
      PMA_PASSWORD: root
      PMA_PORT: "3306"
      PMA_USER: root
      UPLOAD_LIMIT: 4000M
      VIRTUAL_HOST: aksamcrm.ddev.site
    expose:
      - "80"
    extra_hosts:
      - host.docker.internal=host-gateway
    image: phpmyadmin:5
    labels:
      com.ddev.app-type: symfony
      com.ddev.approot: /home/hp/Server/Aksam/AksamCrm
      com.ddev.platform: ddev
      com.ddev.site-name: AksamCrm
      com.ddev.webtag: edbebeadc5
    networks:
      ddev_default: null
      default: null
    restart: 'no'
    volumes:
      - type: bind
        source: /home/hp/Server/Aksam/AksamCrm/.ddev
        target: /mnt/ddev_config
        bind: {}
      - type: volume
        source: ddev-global-cache
        target: /mnt/ddev-global-cache
        volume: {}
    working_dir: /root
  web:
    build:
      context: /home/hp/Server/Aksam/AksamCrm/.ddev/.webimageBuild
      dockerfile: Dockerfile
      args:
        BASE_IMAGE: ddev/ddev-webserver:v1.25.4
        DDEV_DATABASE: mariadb:11.8
        DDEV_PHP_VERSION: "8.3"
        gid: "1000"
        uid: "1000"
        username: hp
      labels:
        com.ddev.app-type: symfony
        com.ddev.approot: /home/hp/Server/Aksam/AksamCrm
        com.ddev.platform: ddev
        com.ddev.site-name: AksamCrm
        com.ddev.webtag: edbebeadc5
    cap_add:
      - SYS_PTRACE
    command:
      - /pre-start.sh
    container_name: ddev-AksamCrm-web
    environment:
      COLUMNS: "185"
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      COREPACK_HOME: /mnt/ddev-global-cache/corepack
      DDEV_APPROOT: /var/www/html
      DDEV_COMPOSER_ROOT: /var/www/html
      DDEV_DATABASE: mariadb:11.8
      DDEV_DATABASE_FAMILY: mysql
      DDEV_DOCROOT: public
      DDEV_FILES_DIR: ""
      DDEV_FILES_DIRS: ""
      DDEV_GID: "1000"
      DDEV_GOARCH: amd64
      DDEV_GOOS: linux
      DDEV_HOSTNAME: aksamcrm.ddev.site
      DDEV_MUTAGEN_ENABLED: "false"
      DDEV_PHP_VERSION: "8.3"
      DDEV_PRIMARY_URL: https://aksamcrm.ddev.site
      DDEV_PRIMARY_URL_PORT: "443"
      DDEV_PRIMARY_URL_WITHOUT_PORT: https://aksamcrm.ddev.site
      DDEV_PROJECT: AksamCrm
      DDEV_PROJECT_TYPE: symfony
      DDEV_ROUTER_HTTP_PORT: "80"
      DDEV_ROUTER_HTTPS_PORT: "443"
      DDEV_SCHEME: https
      DDEV_SITENAME: AksamCrm
      DDEV_TLD: ddev.site
      DDEV_UID: "1000"
      DDEV_USER: hp
      DDEV_VERSION: v1.25.4
      DDEV_WEB_ENTRYPOINT: /mnt/ddev_config/web-entrypoint.d
      DDEV_WEBSERVER_TYPE: nginx-fpm
      DDEV_XDEBUG_ENABLED: "false"
      DDEV_XHPROF_MODE: xhgui
      DEPLOY_NAME: local
      DOCKER_IP: 127.0.0.1
      DOCROOT: public
      DRUSH_OPTIONS_URI: https://aksamcrm.ddev.site
      HOST_DOCKER_INTERNAL_IP: 172.17.0.1
      HTTP_EXPOSE: 80:80,8025:8025
      HTTPS_EXPOSE: 443:80,8026:8025
      IS_DDEV_PROJECT: "true"
      LINES: "15"
      MYSQL_HISTFILE: /mnt/ddev-global-cache/mysqlhistory/AksamCrm-web/mysql_history
      N_CACHE_PREFIX: /mnt/ddev-global-cache/n_prefix/AksamCrm-web
      N_PREFIX: /usr/local/n
      NODE_EXTRA_CA_CERTS: /mnt/ddev-global-cache/mkcert/rootCA.pem
      PGDATABASE: db
      PGHOST: db
      PGPASSWORD: db
      PGUSER: db
      PHP_IDE_CONFIG: serverName=aksamcrm.ddev.site
      SSH_AUTH_SOCK: /home/.ssh-agent/socket
      TZ: Africa/Casablanca
      USER: hp
      VIRTUAL_HOST: aksamcrm.ddev.site
      npm_config_cache: /mnt/ddev-global-cache/npm
    extra_hosts:
      - host.docker.internal=host-gateway
    group_add:
      - "0"
    hostname: AksamCrm-web
    healthcheck:
      test:
        - CMD-SHELL
        - /healthcheck.sh
      timeout: 1m10s
      interval: 1s
      retries: 70
      start_period: 2m0s
      start_interval: 1s
    image: ddev/ddev-webserver:v1.25.4-AksamCrm-built
    labels:
      com.ddev.app-type: symfony
      com.ddev.approot: /home/hp/Server/Aksam/AksamCrm
      com.ddev.platform: ddev
      com.ddev.site-name: AksamCrm
      com.ddev.webtag: edbebeadc5
    networks:
      ddev_default: null
      default: null
    ports:
      - mode: ingress
        host_ip: 127.0.0.1
        target: 80
        protocol: tcp
      - mode: ingress
        host_ip: 127.0.0.1
        target: 443
        protocol: tcp
      - mode: ingress
        host_ip: 127.0.0.1
        target: 8025
        protocol: tcp
    restart: 'no'
    user: 1000:1000
    volumes:
      - type: bind
        source: /home/hp/Server/Aksam/AksamCrm
        target: /var/www/html
        consistency: cached
      - type: bind
        source: /home/hp/Server/Aksam/AksamCrm/.ddev
        target: /mnt/ddev_config
        read_only: true
        bind: {}
      - type: volume
        source: ddev-global-cache
        target: /mnt/ddev-global-cache
        volume: {}
      - type: volume
        source: ddev-ssh-agent_socket_dir
        target: /home/.ssh-agent
        volume: {}
    working_dir: /var/www/html/
  xhgui:
    profiles:
      - xhgui
    container_name: ddev-AksamCrm-xhgui
    depends_on:
      db:
        condition: service_started
        required: true
    environment:
      DDEV_DATABASE_FAMILY: mysql
      HOST_DOCKER_INTERNAL_IP: 172.17.0.1
      HTTP_EXPOSE: 8143:80
      HTTPS_EXPOSE: 8142:80
      TZ: Africa/Casablanca
      VIRTUAL_HOST: aksamcrm.ddev.site
      XHGUI_PDO_PASS: db
      XHGUI_PDO_USER: db
      XHGUI_SAVE_HANDLER: pdo
    extra_hosts:
      - host.docker.internal=host-gateway
    healthcheck:
      test:
        - CMD-SHELL
        - /healthcheck.sh
      timeout: 1m10s
      interval: 1s
      retries: 70
      start_period: 2m0s
      start_interval: 1s
    image: ddev/ddev-xhgui:v1.25.4
    labels:
      com.ddev.app-type: symfony
      com.ddev.approot: /home/hp/Server/Aksam/AksamCrm
      com.ddev.platform: ddev
      com.ddev.site-name: AksamCrm
      com.ddev.webtag: edbebeadc5
    networks:
      ddev_default: null
      default: null
    restart: 'no'
    x-ddev:
      describe-url-port: 'Launch: ddev xhgui'
networks:
  ddev_default:
    name: ddev_default
    external: true
  default:
    name: ddev-aksamcrm_default
    labels:
      com.ddev.app-type: symfony
      com.ddev.approot: /home/hp/Server/Aksam/AksamCrm
      com.ddev.platform: ddev
      com.ddev.site-name: AksamCrm
      com.ddev.webtag: edbebeadc5
volumes:
  database:
    name: AksamCrm-mariadb
    external: true
  ddev-global-cache:
    name: ddev-global-cache
    external: true
  ddev-ssh-agent_socket_dir:
    name: ddev-ssh-agent_socket_dir
    external: true
